<script>
(function(){
  'use strict';
  const state={token:sessionStorage.getItem('ybtk_token')||'',user:null,permissions:[],entity:'dashboard'};
  const userRoles='PEMBINA|PENGAWAS|KETUA|WAKIL_KETUA|SEKRETARIS|BENDAHARA|ADMIN';
  const entities={
    programs:{label:'Program',fields:[['name','Nama program','text'],['category','Kategori','select','Pendidikan Bahasa Inggris|Persiapan Kerja/LPK|Bantuan Panti Asuhan|Bantuan Masyarakat|Lainnya'],['description','Deskripsi','textarea'],['target','Target','text'],['start_date','Tanggal mulai','date'],['end_date','Tanggal selesai','date'],['budget','Anggaran','number'],['pic','PIC','text'],['affiliated','Kolaborasi GPdI','select','FALSE|TRUE']]},
    activities:{label:'Kegiatan',fields:[['program_id','ID program','text'],['title','Judul','text'],['activity_date','Tanggal','date'],['location','Lokasi','text'],['description','Deskripsi','textarea'],['beneficiary_count','Jumlah penerima','number']]},
    participants:{label:'Peserta',fields:[['program_id','ID program','text'],['name','Nama','text'],['identity_key','Kunci identitas','text'],['birth_date','Tanggal lahir','date'],['phone','Telepon','text'],['address','Alamat','textarea']]},
    beneficiaries:{label:'Penerima Manfaat',fields:[['program_id','ID program','text'],['name','Nama','text'],['identity_key','Kunci identitas','text'],['category','Kategori','text'],['phone','Telepon','text'],['address','Alamat','textarea'],['verification_notes','Catatan verifikasi','textarea']]},
    donors:{label:'Donatur',fields:[['name','Nama','text'],['type','Jenis','select','PERORANGAN|ORGANISASI'],['email','Email','email'],['phone','Telepon','text'],['anonymous_public','Anonim di publik','select','TRUE|FALSE']]},
    donations:{label:'Donasi',fields:[['donor_id','ID donatur','text'],['program_id','ID program','text'],['donation_type','Jenis','select','UANG|BARANG'],['amount','Nominal','number'],['received_date','Tanggal diterima','date'],['payment_method','Metode','text'],['evidence_url','Tautan bukti','url'],['notes','Catatan','textarea']]},
    donationItems:{label:'Donasi Barang',fields:[['donation_id','ID donasi','text'],['item_name','Nama barang','text'],['quantity','Jumlah','number'],['unit','Satuan','text'],['condition','Kondisi','text'],['estimated_value','Perkiraan nilai','number'],['distribution_evidence_url','Bukti penyaluran','url']]},
    disbursements:{label:'Pengeluaran',fields:[['program_id','ID program','text'],['transaction_date','Tanggal','date'],['description','Keterangan','textarea'],['amount','Nominal','number'],['recipient','Penerima','text'],['evidence_url','Tautan bukti','url']]},
    publications:{label:'Publikasi',fields:[['type','Jenis','select','BERITA|PROGRAM|GALERI|LAPORAN'],['title','Judul','text'],['summary','Ringkasan','textarea'],['content','Isi','textarea'],['cover_url','Gambar sampul','url'],['program_id','ID program','text'],['affiliated','Kolaborasi GPdI','select','FALSE|TRUE']]}
  };

  function call(name,...args){return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(resolve).withFailureHandler(error=>reject(new Error(error&&error.message||String(error))))[name](...args);});}
  function money(value){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(value||0));}
  function esc(value){const div=document.createElement('div');div.textContent=value==null?'':String(value);return div.innerHTML;}
  function show(id){['publicApp','loginApp','internalApp'].forEach(x=>document.getElementById(x).hidden=x!==id);}
  function toast(message,error){const el=document.getElementById('toast');el.textContent=message;el.style.background=error?'#b42318':'#102321';el.hidden=false;setTimeout(()=>el.hidden=true,3500);}

  async function initPublic(){show('publicApp');try{renderPublic(await call('getPublicData'));}catch(error){toast(error.message,true);}}
  function renderPublic(data){
    const stats=[['Program aktif',data.summary.activePrograms],['Penerima manfaat',data.summary.beneficiaries],['Donasi terverifikasi',money(data.summary.donations)],['Telah disalurkan',money(data.summary.disbursements)]];
    document.getElementById('publicStats').innerHTML=stats.map(x=>`<div class="stat"><strong>${esc(x[1])}</strong><span>${esc(x[0])}</span></div>`).join('');
    document.getElementById('programGrid').innerHTML=data.programs.length?data.programs.map(p=>`<article class="card">${p.affiliated?`<span class="tag">${esc(p.affiliationLabel)}</span>`:''}<h3>${esc(p.name)}</h3><p>${esc(p.description||p.target||'')}</p><small>${esc(p.category)}</small></article>`).join(''):'<div class="empty">Program akan segera ditampilkan.</div>';
    document.getElementById('publicationGrid').innerHTML=data.publications.length?data.publications.slice(0,6).map(p=>`<article class="card">${p.affiliated?`<span class="tag">Kolaborasi GPdI Pniel Deltamas</span>`:''}<h3>${esc(p.title)}</h3><p>${esc(p.summary)}</p><small>${esc(p.publishedAt)}</small></article>`).join(''):'<div class="empty">Belum ada publikasi.</div>';
    document.getElementById('financeSummary').innerHTML=`<div class="finance-row"><span>Donasi terverifikasi</span><strong>${money(data.summary.donations)}</strong></div><div class="finance-row"><span>Penyaluran selesai</span><strong>${money(data.summary.disbursements)}</strong></div><div class="finance-row"><span>Saldo ringkas</span><strong>${money(data.summary.donations-data.summary.disbursements)}</strong></div>`;
    const c=data.contact||{};document.getElementById('contactCard').innerHTML=`<h3>${esc(c.OFFICIAL_BANK_NAME||'Rekening resmi akan diumumkan')}</h3><p>${esc(c.OFFICIAL_BANK_ACCOUNT_NUMBER||'')}</p><p>${esc(c.OFFICIAL_BANK_ACCOUNT_NAME||'')}</p><hr><p>${esc(c.PUBLIC_EMAIL||'')} ${esc(c.PUBLIC_PHONE||'')}</p><p>${esc(c.PUBLIC_ADDRESS||'')}</p>`;
  }

  function initLogin(){show('loginApp');document.getElementById('emailForm').onsubmit=async e=>{e.preventDefault();setAuth('Mengirim kode…');try{const result=await call('requestLoginCode',document.getElementById('loginEmail').value);setAuth(result.message);document.getElementById('emailForm').hidden=true;document.getElementById('codeForm').hidden=false;}catch(error){setAuth(error.message,true);}};document.getElementById('codeForm').onsubmit=async e=>{e.preventDefault();setAuth('Memverifikasi…');try{const result=await call('verifyLoginCode',document.getElementById('loginEmail').value,document.getElementById('loginCode').value);state.token=result.token;sessionStorage.setItem('ybtk_token',state.token);await initInternal();}catch(error){setAuth(error.message,true);}};document.getElementById('backToEmail').onclick=()=>{document.getElementById('emailForm').hidden=false;document.getElementById('codeForm').hidden=true;};}
  function setAuth(message,error){const el=document.getElementById('authMessage');el.textContent=message;el.classList.toggle('danger',!!error);}

  async function initInternal(){if(!state.token){initLogin();return;}show('internalApp');try{const data=await call('getInternalBootstrap',state.token);state.user=data.user;state.permissions=data.permissions;renderShell(data);renderDashboard(data);}catch(error){sessionStorage.removeItem('ybtk_token');state.token='';initLogin();setAuth(error.message,true);}}
  function renderShell(data){document.getElementById('userBadge').innerHTML=`<strong>${esc(data.user.name||data.user.email)}</strong><br>${esc(data.user.role)}`;const menu=[['dashboard','Ringkasan'],...Object.entries(entities).map(([key,value])=>[key,value.label])];if(data.user.role==='ADMIN')menu.push(['users','Kelola Pengguna']);if(['PEMBINA','PENGAWAS','KETUA','ADMIN'].includes(data.user.role))menu.push(['audit','Audit Log']);document.getElementById('adminNav').innerHTML=menu.map(x=>`<button class="nav-item ${x[0]==='dashboard'?'active':''}" data-entity="${x[0]}">${esc(x[1])}</button>`).join('');document.querySelectorAll('.nav-item').forEach(button=>button.onclick=()=>openEntity(button.dataset.entity));document.getElementById('logoutButton').onclick=()=>sessionStorage.removeItem('ybtk_token');}
  function renderDashboard(data){state.entity='dashboard';document.getElementById('pageTitle').textContent='Ringkasan';const cards=[['Program',data.counts.programs],['Peserta',data.counts.participants],['Penerima manfaat',data.counts.beneficiaries],['Donatur',data.counts.donors],['Menunggu ketua',data.counts.pendingChair],['Menunggu pengawas',data.counts.pendingSupervisor]];document.getElementById('adminContent').innerHTML=`<div class="metric-grid">${cards.map(x=>`<div class="metric"><span>${esc(x[0])}</span><strong>${esc(x[1])}</strong></div>`).join('')}</div>${data.health.ok?'':'<p class="message danger">Konfigurasi belum lengkap: '+esc(data.health.missingProperties.join(', '))+'</p>'}`;}
  async function openEntity(entity){state.entity=entity;document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.entity===entity));if(entity==='dashboard'){const data=await call('getInternalBootstrap',state.token);renderDashboard(data);return;}if(entity==='users'){renderUsers();return;}if(entity==='audit'){renderAudit();return;}const meta=entities[entity];document.getElementById('pageTitle').textContent=meta.label;document.getElementById('adminContent').innerHTML='<div class="skeleton">Memuat data…</div>';try{renderEntity(entity,await call('listEntity',state.token,entity));}catch(error){toast(error.message,true);}}
  function renderEntity(entity,records){const meta=entities[entity],canEdit=state.permissions.includes(entity);const headers=['id',...meta.fields.slice(0,4).map(x=>x[0]),'status'];document.getElementById('adminContent').innerHTML=`<div class="toolbar"><p>${records.length} catatan</p>${canEdit?'<button id="newRecord" class="button primary">Tambah data</button>':''}</div><div id="formMount"></div><div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h.replaceAll('_',' '))}</th>`).join('')}<th>Tindakan</th></tr></thead><tbody>${records.length?records.map(r=>`<tr>${headers.map(h=>`<td>${esc(r[h]||'')}</td>`).join('')}<td>${actionButtons(entity,r,canEdit)}</td></tr>`).join(''):`<tr><td colspan="${headers.length+1}" class="empty">Belum ada data.</td></tr>`}</tbody></table></div>`;if(canEdit)document.getElementById('newRecord').onclick=()=>renderForm(entity,{});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>renderForm(entity,records.find(r=>r.id===b.dataset.edit)));bindActions(entity);}
  function actionButtons(entity,r,canEdit){let html=canEdit?`<button class="button ghost" data-edit="${esc(r.id)}">Edit</button>`:'';if(entity==='disbursements'){if(r.status==='DRAFT'&&['BENDAHARA','ADMIN'].includes(state.user.role))html+=` <button class="button secondary" data-submit="${esc(r.id)}">Ajukan</button>`;if(r.status==='PENDING_CHAIR'&&['KETUA','ADMIN'].includes(state.user.role))html+=` <button class="button primary" data-chair="${esc(r.id)}">Putuskan</button>`;if(r.status==='PENDING_SUPERVISOR'&&['PENGAWAS','ADMIN'].includes(state.user.role))html+=` <button class="button primary" data-review="${esc(r.id)}">Periksa</button>`;}if(entity==='publications'&&['DRAFT','PENDING_APPROVAL'].includes(r.status)&&['KETUA','ADMIN'].includes(state.user.role))html+=` <button class="button primary" data-publish="${esc(r.id)}">Putuskan</button>`;return html||'-';}
  function renderForm(entity,record){const meta=entities[entity];document.getElementById('formMount').innerHTML=`<form id="entityForm" class="form-panel"><h3>${record.id?'Ubah':'Tambah'} ${esc(meta.label)}</h3><div class="form-grid">${meta.fields.map(f=>fieldHtml(f,record[f[0]]||'')).join('')}</div><input type="hidden" name="id" value="${esc(record.id||'')}"><button class="button primary" type="submit">Simpan</button><button class="button ghost" id="cancelForm" type="button">Batal</button></form>`;document.getElementById('cancelForm').onclick=()=>document.getElementById('formMount').innerHTML='';document.getElementById('entityForm').onsubmit=async e=>{e.preventDefault();const input=Object.fromEntries(new FormData(e.target).entries());try{await call('saveEntity',state.token,entity,input);toast('Data berhasil disimpan.');openEntity(entity);}catch(error){toast(error.message,true);}};}
  function fieldHtml(field,value){const [name,label,type,options]=field,wide=type==='textarea'?'wide':'';if(type==='textarea')return `<label class="${wide}">${esc(label)}<textarea name="${name}" rows="3">${esc(value)}</textarea></label>`;if(type==='select')return `<label>${esc(label)}<select name="${name}">${options.split('|').map(o=>`<option value="${esc(o)}" ${String(value)===o?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;return `<label>${esc(label)}<input name="${name}" type="${type}" value="${esc(value)}"></label>`;}
  function bindActions(entity){document.querySelectorAll('[data-submit]').forEach(b=>b.onclick=async()=>runAction('submitDisbursement',[b.dataset.submit],entity));document.querySelectorAll('[data-chair]').forEach(b=>b.onclick=async()=>{const decision=confirm('Setujui pengeluaran ini? Pilih Batal untuk menolak.')?'APPROVE':'REJECT';await runAction('decideDisbursement',[b.dataset.chair,decision,prompt('Catatan keputusan:')||''],entity);});document.querySelectorAll('[data-review]').forEach(b=>b.onclick=async()=>{const decision=confirm('Verifikasi transaksi ini? Pilih Batal untuk meminta klarifikasi.')?'VERIFY':'CLARIFY';await runAction('reviewDisbursement',[b.dataset.review,decision,prompt('Catatan pemeriksaan:')||''],entity);});document.querySelectorAll('[data-publish]').forEach(b=>b.onclick=async()=>{const decision=confirm('Terbitkan konten ini? Pilih Batal untuk menolak.')?'PUBLISH':'REJECT';await runAction('decidePublication',[b.dataset.publish,decision,prompt('Catatan keputusan:')||''],entity);});}
  async function runAction(fn,args,entity){try{await call(fn,state.token,...args);toast('Proses berhasil.');openEntity(entity);}catch(error){toast(error.message,true);}}
  async function renderAudit(){document.getElementById('pageTitle').textContent='Audit Log';document.getElementById('adminContent').innerHTML='<div class="skeleton">Memuat audit…</div>';try{const rows=await call('getAuditLog',state.token);document.getElementById('adminContent').innerHTML=`<div class="table-wrap"><table><thead><tr><th>Waktu</th><th>Entitas</th><th>Aksi</th><th>Pengguna</th><th>Peran</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.created_at)}</td><td>${esc(r.entity)} / ${esc(r.entity_id)}</td><td>${esc(r.action)}</td><td>${esc(r.actor_email)}</td><td>${esc(r.actor_role)}</td></tr>`).join('')}</tbody></table></div>`;}catch(error){toast(error.message,true);}}
  async function renderUsers(){document.getElementById('pageTitle').textContent='Kelola Pengguna';document.getElementById('adminContent').innerHTML='<div class="skeleton">Memuat pengguna…</div>';try{const rows=await call('listUsers',state.token);document.getElementById('adminContent').innerHTML=`<div class="toolbar"><p>${rows.length} pengguna internal</p><button id="newUser" class="button primary">Tambah pengguna</button></div><div id="userFormMount"></div><div class="table-wrap"><table><thead><tr><th>Nama</th><th>Email</th><th>Peran</th><th>Status</th><th>Diperbarui</th><th>Tindakan</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td>${esc(r.role)}</td><td><span class="tag-status">${r.active==='TRUE'?'Aktif':'Nonaktif'}</span></td><td>${esc(r.updated_at||r.created_at)}</td><td><button class="button ghost" data-user-edit="${esc(r.id)}">Edit</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Belum ada pengguna.</td></tr>'}</tbody></table></div>`;document.getElementById('newUser').onclick=()=>renderUserForm({active:'TRUE'});document.querySelectorAll('[data-user-edit]').forEach(button=>button.onclick=()=>renderUserForm(rows.find(row=>row.id===button.dataset.userEdit)));}catch(error){toast(error.message,true);}}
  function renderUserForm(record){document.getElementById('userFormMount').innerHTML=`<form id="userForm" class="form-panel"><h3>${record.id?'Ubah':'Tambah'} Pengguna</h3><div class="form-grid">${fieldHtml(['name','Nama lengkap','text'],record.name||'')}${fieldHtml(['email','Email login','email'],record.email||'')}${fieldHtml(['role','Peran','select',userRoles],record.role||'SEKRETARIS')}${fieldHtml(['active','Status akses','select','TRUE|FALSE'],record.active||'TRUE')}</div><input type="hidden" name="id" value="${esc(record.id||'')}"><button class="button primary" type="submit">Simpan</button><button class="button ghost" id="cancelUserForm" type="button">Batal</button></form>`;document.getElementById('cancelUserForm').onclick=()=>document.getElementById('userFormMount').innerHTML='';document.getElementById('userForm').onsubmit=async event=>{event.preventDefault();const input=Object.fromEntries(new FormData(event.target).entries());try{await call('saveUser',state.token,input);toast('Pengguna berhasil disimpan.');renderUsers();}catch(error){toast(error.message,true);}};}
  document.querySelectorAll('[data-public-target]').forEach(button=>button.onclick=()=>document.getElementById(button.dataset.publicTarget).scrollIntoView({behavior:'smooth'}));
  window.INITIAL_PAGE==='internal'?initInternal():initPublic();
})();
</script>
