<script>
(function(){
  'use strict';
  const state={token:sessionStorage.getItem('ybtk_token')||'',user:null,permissions:[],editableProgramIds:[],entity:'dashboard',references:null};
  const userRoles='PEMBINA|PENGAWAS|KETUA|WAKIL_KETUA|SEKRETARIS|BENDAHARA|STAF_PROGRAM|ADMIN';
  const evidenceFields={donations:'evidence_url',donationItems:'distribution_evidence_url',disbursements:'evidence_url',publications:'cover_url'};
  const maxUploadBytes=5*1024*1024;
  const entities={
    programs:{label:'Program',fields:[['name','Nama program','text'],['category','Kategori','select','Pendidikan Bahasa Inggris|Persiapan Kerja/LPK|Bantuan Panti Asuhan|Bantuan Masyarakat|Lainnya'],['description','Deskripsi','textarea'],['target','Target','text'],['start_date','Tanggal mulai','date'],['end_date','Tanggal selesai','date'],['budget','Anggaran','number'],['pic','PIC','text'],['affiliated','Kolaborasi GPdI','select','FALSE|TRUE']]},
    activities:{label:'Kegiatan',fields:[['program_id','Program','reference','programs','required'],['title','Judul','text'],['activity_date','Tanggal','date'],['location','Lokasi','text'],['description','Deskripsi','textarea'],['beneficiary_count','Jumlah penerima','number']]},
    participants:{label:'Peserta',fields:[['program_id','Program','reference','programs','required'],['name','Nama','text'],['identity_key','Kunci identitas','text'],['birth_date','Tanggal lahir','date'],['phone','Telepon','text'],['address','Alamat','textarea']]},
    beneficiaries:{label:'Penerima Manfaat',fields:[['program_id','Program','reference','programs','required'],['name','Nama','text'],['identity_key','Kunci identitas','text'],['category','Kategori','text'],['phone','Telepon','text'],['address','Alamat','textarea'],['verification_notes','Catatan verifikasi','textarea']]},
    donors:{label:'Donatur',fields:[['name','Nama','text'],['type','Jenis','select','PERORANGAN|ORGANISASI'],['email','Email','email'],['phone','Telepon','text'],['anonymous_public','Anonim di publik','select','TRUE|FALSE']]},
    donations:{label:'Donasi',fields:[['donor_id','Donatur','reference','donors','required'],['program_id','Program tujuan','reference','programs','optional'],['donation_type','Jenis','select','UANG|BARANG'],['amount','Nominal','number'],['received_date','Tanggal diterima','date'],['payment_method','Metode','text'],['evidence_url','Bukti penerimaan','file','image/jpeg,image/png,application/pdf'],['notes','Catatan','textarea']]},
    donationItems:{label:'Donasi Barang',fields:[['donation_id','Donasi terkait','reference','donations','required'],['item_name','Nama barang','text'],['quantity','Jumlah','number'],['unit','Satuan','text'],['condition','Kondisi','text'],['estimated_value','Perkiraan nilai','number'],['distribution_evidence_url','Bukti penyaluran','file','image/jpeg,image/png,application/pdf']]},
    disbursements:{label:'Pengeluaran',fields:[['program_id','Program','reference','programs','required'],['transaction_date','Tanggal','date'],['description','Keterangan','textarea'],['amount','Nominal','number'],['recipient','Penerima','text'],['evidence_url','Bukti pengeluaran','file','image/jpeg,image/png,application/pdf']]},
    publications:{label:'Publikasi',fields:[['type','Jenis','select','BERITA|PROGRAM|GALERI|LAPORAN'],['title','Judul','text'],['summary','Ringkasan','textarea'],['content','Isi','textarea'],['cover_url','Gambar sampul','file','image/jpeg,image/png'],['program_id','Program terkait','reference','programs','optional'],['affiliated','Kolaborasi GPdI','select','FALSE|TRUE']]}
  };

  function call(name,...args){return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(resolve).withFailureHandler(error=>reject(new Error(error&&error.message||String(error))))[name](...args);});}
  function money(value){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(value||0));}
  function esc(value){const div=document.createElement('div');div.textContent=value==null?'':String(value);return div.innerHTML;}
  function show(id){['publicApp','loginApp','internalApp'].forEach(x=>document.getElementById(x).hidden=x!==id);}
  function toast(message,error){const el=document.getElementById('toast');el.textContent=message;el.style.background=error?'#b42318':'#102321';el.hidden=false;setTimeout(()=>el.hidden=true,3500);}

  async function initPublic(){show('publicApp');try{renderPublic(await call('getPublicData'));}catch(error){toast(error.message,true);}}
  function renderPublic(data){
    const stats=[['Program aktif',data.summary.activePrograms],['Penerima manfaat',data.summary.beneficiaries],['Donasi terverifikasi',money(data.summary.donations)],['Telah disalurkan',money(data.summary.disbursements)]];
    document.getElementById('publicStats').innerHTML=stats.map(x=>`<div class="stat"><strong>${esc(x[1])}</strong><span>${esc(x[0])}</span></div>`).join('');
    document.getElementById('programGrid').innerHTML=data.programs.length?data.programs.map(p=>`<article class="card">${p.affiliated?`<span class="tag">${esc(p.affiliationLabel)}</span>`:''}<h3>${esc(p.name)}</h3><p>${esc(p.description||p.target||'')}</p><small>${esc(p.category)}</small></article>`).join(''):'<div class="empty">Program akan segera ditampilkan.</div>';
    document.getElementById('publicationGrid').innerHTML=data.publications.length?data.publications.slice(0,6).map(p=>`<article class="card">${p.affiliated?`<span class="tag">Kolaborasi GPdI Pniel Deltamas</span>`:''}<h3>${esc(p.title)}</h3><p>${esc(p.summary)}</p><small>${esc(p.publishedAt)}</small></article>`).join(''):'<div class="empty">Belum ada publikasi.</div>';
    document.getElementById('financeSummary').innerHTML=`<div class="finance-row"><span>Donasi terverifikasi</span><strong>${money(data.summary.donations)}</strong></div><div class="finance-row"><span>Penyaluran selesai</span><strong>${money(data.summary.disbursements)}</strong></div><div class="finance-row"><span>Saldo ringkas</span><strong>${money(data.summary.donations-data.summary.disbursements)}</strong></div>`;
    const c=Object.assign({},window.OFFICIAL_CONTACT||{},data.contact||{});document.getElementById('contactCard').innerHTML=`<h3>${esc(c.OFFICIAL_BANK_NAME||'Rekening resmi akan diumumkan')}</h3><p>${esc(c.OFFICIAL_BANK_ACCOUNT_NUMBER||'')}</p><p>${esc(c.OFFICIAL_BANK_ACCOUNT_NAME||'')}</p><hr><p>${esc(c.PUBLIC_EMAIL||'')} ${esc(c.PUBLIC_PHONE||'')}</p><p>${esc(c.PUBLIC_ADDRESS||'')}</p>`;
  }

  function initLogin(){show('loginApp');document.getElementById('emailForm').onsubmit=async e=>{e.preventDefault();setAuth('Mengirim kode…');try{const result=await call('requestLoginCode',document.getElementById('loginEmail').value);setAuth(result.message);document.getElementById('emailForm').hidden=true;document.getElementById('codeForm').hidden=false;}catch(error){setAuth(error.message,true);}};document.getElementById('codeForm').onsubmit=async e=>{e.preventDefault();setAuth('Memverifikasi…');try{const result=await call('verifyLoginCode',document.getElementById('loginEmail').value,document.getElementById('loginCode').value);state.token=result.token;sessionStorage.setItem('ybtk_token',state.token);await initInternal();}catch(error){setAuth(error.message,true);}};document.getElementById('backToEmail').onclick=()=>{document.getElementById('emailForm').hidden=false;document.getElementById('codeForm').hidden=true;};}
  function setAuth(message,error){const el=document.getElementById('authMessage');el.textContent=message;el.classList.toggle('danger',!!error);}

  async function initInternal(){if(!state.token){initLogin();return;}show('internalApp');try{const data=await call('getInternalBootstrap',state.token);state.user=data.user;state.permissions=data.permissions;state.editableProgramIds=data.editableProgramIds||[];renderShell(data);renderDashboard(data);}catch(error){sessionStorage.removeItem('ybtk_token');state.token='';initLogin();setAuth(error.message,true);}}
  function renderShell(data){document.getElementById('userBadge').innerHTML=`<strong>${esc(data.user.name||data.user.email)}</strong><br>${esc(data.user.role)}`;const staff=data.user.role==='STAF_PROGRAM',visible=staff?['programs','activities','participants','beneficiaries','publications']:Object.keys(entities),menu=[['dashboard','Ringkasan'],...visible.map(key=>[key,entities[key].label])];if(['STAF_PROGRAM','SEKRETARIS','KETUA','ADMIN'].includes(data.user.role))menu.push(['programRequests','Usulan Program']);if(data.user.role==='ADMIN'){menu.push(['staffAccess','Akses Staf']);menu.push(['users','Kelola Pengguna']);}if(['PEMBINA','PENGAWAS','KETUA','ADMIN'].includes(data.user.role))menu.push(['audit','Audit Log']);document.getElementById('adminNav').innerHTML=menu.map(x=>`<button class="nav-item ${x[0]==='dashboard'?'active':''}" data-entity="${x[0]}">${esc(x[1])}</button>`).join('');document.querySelectorAll('.nav-item').forEach(button=>button.onclick=()=>openEntity(button.dataset.entity));document.getElementById('logoutButton').onclick=()=>sessionStorage.removeItem('ybtk_token');}
  function renderDashboard(data){state.entity='dashboard';document.getElementById('pageTitle').textContent='Ringkasan';const cards=data.user.role==='STAF_PROGRAM'?[['Program ditugaskan',data.counts.programs],['Peserta',data.counts.participants],['Penerima manfaat',data.counts.beneficiaries]]:[['Program',data.counts.programs],['Peserta',data.counts.participants],['Penerima manfaat',data.counts.beneficiaries],['Donatur',data.counts.donors],['Menunggu ketua',data.counts.pendingChair],['Menunggu pengawas',data.counts.pendingSupervisor]];document.getElementById('adminContent').innerHTML=`<div class="metric-grid">${cards.map(x=>`<div class="metric"><span>${esc(x[0])}</span><strong>${esc(x[1])}</strong></div>`).join('')}</div>${data.health.ok?'':'<p class="message danger">Konfigurasi belum lengkap: '+esc(data.health.missingProperties.join(', '))+'</p>'}`;}
  async function ensureReferences(force){if(!state.references||force)state.references=await call('getReferenceOptions',state.token);return state.references;}
  async function openEntity(entity){state.entity=entity;document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.entity===entity));if(entity==='dashboard'){const data=await call('getInternalBootstrap',state.token);renderDashboard(data);return;}if(entity==='users'){renderUsers();return;}if(entity==='staffAccess'){renderStaffAccess();return;}if(entity==='programRequests'){renderProgramRequests();return;}if(entity==='audit'){renderAudit();return;}const meta=entities[entity];document.getElementById('pageTitle').textContent=meta.label;document.getElementById('adminContent').innerHTML='<div class="skeleton">Memuat data…</div>';try{const results=await Promise.all([call('listEntity',state.token,entity),ensureReferences(false)]);renderEntity(entity,results[0]);}catch(error){toast(error.message,true);}}
  function renderEntity(entity,records){const meta=entities[entity],canEdit=state.permissions.includes(entity),canAdd=canEdit&&(state.user.role!=='STAF_PROGRAM'||state.editableProgramIds.length>0);const headers=['id',...meta.fields.slice(0,4).map(x=>x[0]),'status'];document.getElementById('adminContent').innerHTML=`<div class="toolbar"><p>${records.length} catatan</p>${canAdd?'<button id="newRecord" class="button primary">Tambah data</button>':''}</div><div id="formMount"></div><div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${esc(fieldLabel(meta,h))}</th>`).join('')}<th>Tindakan</th></tr></thead><tbody>${records.length?records.map(r=>`<tr>${headers.map(h=>`<td>${esc(displayValue(meta,h,r[h]))}</td>`).join('')}<td>${actionButtons(entity,r,canEdit)}</td></tr>`).join(''):`<tr><td colspan="${headers.length+1}" class="empty">Belum ada data.</td></tr>`}</tbody></table></div>`;if(canAdd)document.getElementById('newRecord').onclick=()=>renderForm(entity,{});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>renderForm(entity,records.find(r=>r.id===b.dataset.edit)));document.querySelectorAll('[data-program-request]').forEach(b=>b.onclick=()=>renderProgramRequestForm(records.find(r=>r.id===b.dataset.programRequest)));bindActions(entity);}
  function fieldLabel(meta,name){if(name==='id')return 'ID sistem';const field=meta.fields.find(item=>item[0]===name);return field?field[1]:name.replaceAll('_',' ');}
  function displayValue(meta,name,value){const field=meta.fields.find(item=>item[0]===name);if(!field||field[2]!=='reference'||!value)return value||'';const option=((state.references&&state.references[field[3]])||[]).find(item=>item.value===String(value));return option?option.label:value;}
  function actionButtons(entity,r,canEdit){const staff=state.user.role==='STAF_PROGRAM',programId=entity==='programs'?r.id:r.program_id,staffCanEdit=!staff||state.editableProgramIds.includes(String(programId||'')),rowCanEdit=canEdit&&staffCanEdit&&!(staff&&entity==='publications'&&r.status!=='DRAFT');let html=rowCanEdit?`<button class="button ghost" data-edit="${esc(r.id)}">Edit</button>`:'';if(staff&&entity==='programs'&&staffCanEdit)html+=` <button class="button secondary" data-program-request="${esc(r.id)}">Ajukan perubahan</button>`;const evidenceField=evidenceFields[entity];if(evidenceField&&r[evidenceField])html+=` <button class="button secondary" data-evidence="${esc(r.id)}">Lihat bukti</button>`;if(entity==='disbursements'){if(r.status==='DRAFT'&&['BENDAHARA','ADMIN'].includes(state.user.role))html+=` <button class="button secondary" data-submit="${esc(r.id)}">Ajukan</button>`;if(r.status==='PENDING_CHAIR'&&['KETUA','ADMIN'].includes(state.user.role))html+=` <button class="button primary" data-chair="${esc(r.id)}">Putuskan</button>`;if(r.status==='PENDING_SUPERVISOR'&&['PENGAWAS','ADMIN'].includes(state.user.role))html+=` <button class="button primary" data-review="${esc(r.id)}">Periksa</button>`;}if(entity==='publications'&&['DRAFT','PENDING_APPROVAL'].includes(r.status)&&['KETUA','ADMIN'].includes(state.user.role))html+=` <button class="button primary" data-publish="${esc(r.id)}">Putuskan</button>`;return html||'-';}
  function renderForm(entity,record){const meta=entities[entity],idInfo=record.id?`<label>ID sistem<input type="text" value="${esc(record.id)}" readonly></label>`:'<p class="message">ID sistem akan dibuat otomatis setelah data disimpan.</p>';document.getElementById('formMount').innerHTML=`<form id="entityForm" class="form-panel"><h3>${record.id?'Ubah':'Tambah'} ${esc(meta.label)}</h3>${idInfo}<div class="form-grid">${meta.fields.map(f=>fieldHtml(f,record[f[0]]||'')).join('')}</div><input type="hidden" name="id" value="${esc(record.id||'')}"><button class="button primary" type="submit">Simpan</button><button class="button ghost" id="cancelForm" type="button">Batal</button></form>`;document.getElementById('cancelForm').onclick=()=>document.getElementById('formMount').innerHTML='';document.getElementById('entityForm').onsubmit=async e=>{e.preventDefault();const form=e.target,submit=form.querySelector('[type="submit"]'),input=Object.fromEntries(new FormData(form).entries()),upload=form.querySelector('[data-upload-field]');try{if(state.user.role==='STAF_PROGRAM'&&entity==='publications'&&!input.program_id)throw new Error('Staf Program wajib memilih Program terkait.');submit.disabled=true;submit.textContent=upload&&upload.files.length?'Mengunggah…':'Menyimpan…';if(upload&&upload.files.length){const payload=await fileToPayload(upload.files[0],upload.accept);await call('saveEntityWithEvidence',state.token,entity,input,payload);}else{await call('saveEntity',state.token,entity,input);}state.references=null;toast('Data berhasil disimpan.');await openEntity(entity);}catch(error){toast(error.message,true);submit.disabled=false;submit.textContent='Simpan';}};}
  function fieldHtml(field,value){const [name,label,type,options,mode]=field,wide=type==='textarea'?'wide':'';if(type==='textarea')return `<label class="${wide}">${esc(label)}<textarea name="${name}" rows="3">${esc(value)}</textarea></label>`;if(type==='select')return `<label>${esc(label)}<select name="${name}">${options.split('|').map(o=>`<option value="${esc(o)}" ${String(value)===o?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;if(type==='file'){const hint=options.includes('application/pdf')?'JPG, PNG, atau PDF; maksimal 5 MB.':'JPG atau PNG; maksimal 5 MB.';return `<label class="wide">${esc(label)}<input type="file" data-upload-field data-field="${esc(name)}" accept="${esc(options)}"><small>${value?'File sudah tersimpan. Pilih file baru untuk mengganti.':hint}</small></label>`;}if(type==='reference'){const available=(state.references&&state.references[options])||[],optional=mode==='optional',current=String(value||''),known=available.some(item=>item.value===current),placeholder=optional?'Tidak terkait':'Pilih '+label.toLowerCase(),legacy=current&&!known?`<option value="${esc(current)}" selected>Referensi lama — ${esc(current)}</option>`:'',choices=available.map(item=>`<option value="${esc(item.value)}" ${current===item.value?'selected':''}>${esc(item.label)}</option>`).join('');return `<label>${esc(label)}<select name="${name}" ${optional?'':'required'}><option value="">${esc(placeholder)}</option>${legacy}${choices}</select></label>`;}return `<label>${esc(label)}<input name="${name}" type="${type}" value="${esc(value)}"></label>`;}
  function fileToPayload(file,accept){return new Promise((resolve,reject)=>{if(!file||!file.size)return reject(new Error('Pilih file yang akan diunggah.'));if(file.size>maxUploadBytes)return reject(new Error('Ukuran file maksimal 5 MB.'));const allowed=String(accept||'').split(',').filter(Boolean);if(!allowed.includes(file.type))return reject(new Error('Format file tidak sesuai untuk isian ini.'));const reader=new FileReader();reader.onerror=()=>reject(new Error('File tidak dapat dibaca.'));reader.onload=()=>resolve({name:file.name,type:file.type,size:file.size,dataBase64:String(reader.result).split(',')[1]||''});reader.readAsDataURL(file);});}
  function bindActions(entity){document.querySelectorAll('[data-evidence]').forEach(b=>b.onclick=()=>previewEvidence(entity,b.dataset.evidence));document.querySelectorAll('[data-submit]').forEach(b=>b.onclick=async()=>runAction('submitDisbursement',[b.dataset.submit],entity));document.querySelectorAll('[data-chair]').forEach(b=>b.onclick=async()=>{const decision=confirm('Setujui pengeluaran ini? Pilih Batal untuk menolak.')?'APPROVE':'REJECT';await runAction('decideDisbursement',[b.dataset.chair,decision,prompt('Catatan keputusan:')||''],entity);});document.querySelectorAll('[data-review]').forEach(b=>b.onclick=async()=>{const decision=confirm('Verifikasi transaksi ini? Pilih Batal untuk meminta klarifikasi.')?'VERIFY':'CLARIFY';await runAction('reviewDisbursement',[b.dataset.review,decision,prompt('Catatan pemeriksaan:')||''],entity);});document.querySelectorAll('[data-publish]').forEach(b=>b.onclick=async()=>{const decision=confirm('Terbitkan konten ini? Pilih Batal untuk menolak.')?'PUBLISH':'REJECT';await runAction('decidePublication',[b.dataset.publish,decision,prompt('Catatan keputusan:')||''],entity);});}
  async function previewEvidence(entity,id){const viewer=window.open('about:blank','_blank');if(!viewer){toast('Izinkan pop-up untuk melihat bukti.',true);return;}viewer.document.body.textContent='Memuat bukti…';try{const result=await call('getEvidenceFile',state.token,entity,id);if(result.mode==='external'){viewer.location.href=result.url;return;}const binary=atob(result.dataBase64),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i+=1)bytes[i]=binary.charCodeAt(i);const url=URL.createObjectURL(new Blob([bytes],{type:result.mimeType}));viewer.location.href=url;setTimeout(()=>URL.revokeObjectURL(url),300000);}catch(error){viewer.close();toast(error.message,true);}}
  async function runAction(fn,args,entity){try{await call(fn,state.token,...args);toast('Proses berhasil.');openEntity(entity);}catch(error){toast(error.message,true);}}
  function renderProgramRequestForm(program){if(!program)return;const meta=entities.programs;document.getElementById('formMount').innerHTML=`<form id="programRequestForm" class="form-panel"><h3>Ajukan Perubahan Program</h3><p class="message">Perubahan tidak langsung tampil. Sekretaris, Ketua, atau Admin harus menyetujuinya.</p><label>ID Program<input type="text" value="${esc(program.id)}" readonly></label><div class="form-grid">${meta.fields.map(field=>fieldHtml(field,program[field[0]]||'')).join('')}<label class="wide">Alasan perubahan<textarea name="notes" rows="3" required></textarea></label></div><input type="hidden" name="program_id" value="${esc(program.id)}"><button class="button primary" type="submit">Kirim usulan</button><button class="button ghost" id="cancelProgramRequest" type="button">Batal</button></form>`;document.getElementById('cancelProgramRequest').onclick=()=>document.getElementById('formMount').innerHTML='';document.getElementById('programRequestForm').onsubmit=async event=>{event.preventDefault();const values=Object.fromEntries(new FormData(event.target).entries()),payload={program_id:values.program_id,notes:values.notes,fields:{}};meta.fields.forEach(field=>payload.fields[field[0]]=values[field[0]]||'');try{await call('saveProgramChangeRequest',state.token,payload);toast('Usulan Program berhasil dikirim.');openEntity('programRequests');}catch(error){toast(error.message,true);}};document.getElementById('formMount').scrollIntoView({behavior:'smooth'});}
  function programRequestSummary(request){try{const fields=JSON.parse(request.fields_json||'{}'),labels=Object.fromEntries(entities.programs.fields.map(field=>[field[0],field[1]]));return Object.entries(fields).map(([key,value])=>`${labels[key]||key}: ${value||'—'}`).join(' · ');}catch(error){return 'Isi usulan tidak dapat dibaca';}}
  async function renderProgramRequests(){document.getElementById('pageTitle').textContent='Usulan Perubahan Program';document.getElementById('adminContent').innerHTML='<div class="skeleton">Memuat usulan…</div>';try{const rows=await call('listProgramChangeRequests',state.token),reviewer=['SEKRETARIS','KETUA','ADMIN'].includes(state.user.role);await ensureReferences(false);const programs=Object.fromEntries(((state.references&&state.references.programs)||[]).map(item=>[item.value,item.label]));document.getElementById('adminContent').innerHTML=`<p class="message">${state.user.role==='STAF_PROGRAM'?'Untuk membuat usulan, buka menu Program lalu tekan Ajukan perubahan.':'Periksa perubahan sebelum menyetujui karena keputusan APPROVE langsung memperbarui Program.'}</p><div class="table-wrap"><table><thead><tr><th>Program</th><th>Pengusul</th><th>Perubahan</th><th>Catatan</th><th>Status</th><th>Tindakan</th></tr></thead><tbody>${rows.length?rows.map(row=>`<tr><td>${esc(programs[row.program_id]||row.program_id)}</td><td>${esc(row.requested_by)}</td><td>${esc(programRequestSummary(row))}</td><td>${esc(row.notes)}</td><td>${esc(row.status)}</td><td>${reviewer&&row.status==='PENDING_REVIEW'?`<button class="button primary" data-request-approve="${esc(row.id)}">Setujui</button> <button class="button ghost" data-request-reject="${esc(row.id)}">Tolak</button>`:'-'}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">Belum ada usulan Program.</td></tr>'}</tbody></table></div>`;document.querySelectorAll('[data-request-approve]').forEach(button=>button.onclick=()=>decideProgramRequest(button.dataset.requestApprove,'APPROVE'));document.querySelectorAll('[data-request-reject]').forEach(button=>button.onclick=()=>decideProgramRequest(button.dataset.requestReject,'REJECT'));}catch(error){toast(error.message,true);}}
  async function decideProgramRequest(id,decision){const label=decision==='APPROVE'?'menyetujui dan menerapkan':'menolak';if(!confirm(`Yakin ${label} usulan Program ini?`))return;const notes=prompt('Catatan keputusan:')||'';try{await call('decideProgramChangeRequest',state.token,id,decision,notes);toast('Keputusan usulan berhasil disimpan.');renderProgramRequests();}catch(error){toast(error.message,true);}}
  async function renderStaffAccess(){document.getElementById('pageTitle').textContent='Akses Staf Program';document.getElementById('adminContent').innerHTML='<div class="skeleton">Memuat penugasan…</div>';try{const results=await Promise.all([call('listProgramAccess',state.token),call('listUsers',state.token),ensureReferences(true)]),rows=results[0],users=results[1].filter(user=>user.role==='STAF_PROGRAM'),programs=results[2].programs||[],userMap=Object.fromEntries(users.map(user=>[user.id,`${user.name} — ${user.email}`])),programMap=Object.fromEntries(programs.map(program=>[program.value,program.label]));document.getElementById('adminContent').innerHTML=`<div class="toolbar"><p>${rows.length} penugasan</p><button id="newStaffAccess" class="button primary" ${users.length?'':'disabled'}>Tambah penugasan</button></div>${users.length?'':'<p class="message danger">Tambahkan pengguna dengan peran STAF_PROGRAM terlebih dahulu.</p>'}<div id="staffAccessFormMount"></div><div class="table-wrap"><table><thead><tr><th>Staf</th><th>Program</th><th>Akses</th><th>Mulai</th><th>Berakhir</th><th>Status</th><th>Tindakan</th></tr></thead><tbody>${rows.length?rows.map(row=>`<tr><td>${esc(userMap[row.user_id]||row.user_id)}</td><td>${esc(programMap[row.program_id]||row.program_id)}</td><td>${esc(row.access_level)}</td><td>${esc(row.start_date||'—')}</td><td>${esc(row.end_date||'—')}</td><td>${row.active==='TRUE'?'Aktif':'Nonaktif'}</td><td><button class="button ghost" data-access-edit="${esc(row.id)}">Edit</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">Belum ada penugasan Staf.</td></tr>'}</tbody></table></div>`;const openForm=record=>renderStaffAccessForm(record,users,programs);document.getElementById('newStaffAccess').onclick=()=>openForm({access_level:'EDIT',active:'TRUE'});document.querySelectorAll('[data-access-edit]').forEach(button=>button.onclick=()=>openForm(rows.find(row=>row.id===button.dataset.accessEdit)));}catch(error){toast(error.message,true);}}
  function renderStaffAccessForm(record,users,programs){document.getElementById('staffAccessFormMount').innerHTML=`<form id="staffAccessForm" class="form-panel"><h3>${record.id?'Ubah':'Tambah'} Penugasan Staf</h3><div class="form-grid"><label>Staf Program<select name="user_id" required><option value="">Pilih staf</option>${users.map(user=>`<option value="${esc(user.id)}" ${record.user_id===user.id?'selected':''}>${esc(user.name)} — ${esc(user.email)}</option>`).join('')}</select></label><label>Program<select name="program_id" required><option value="">Pilih Program</option>${programs.map(program=>`<option value="${esc(program.value)}" ${record.program_id===program.value?'selected':''}>${esc(program.label)}</option>`).join('')}</select></label><label>Tingkat akses<select name="access_level"><option value="EDIT" ${record.access_level==='EDIT'?'selected':''}>EDIT — lihat dan ubah</option><option value="VIEW" ${record.access_level==='VIEW'?'selected':''}>VIEW — hanya lihat</option></select></label><label>Status<select name="active"><option value="TRUE" ${record.active!=='FALSE'?'selected':''}>Aktif</option><option value="FALSE" ${record.active==='FALSE'?'selected':''}>Nonaktif</option></select></label><label>Tanggal mulai<input type="date" name="start_date" value="${esc(record.start_date||'')}"></label><label>Tanggal berakhir<input type="date" name="end_date" value="${esc(record.end_date||'')}"></label></div><input type="hidden" name="id" value="${esc(record.id||'')}"><button class="button primary" type="submit">Simpan</button><button class="button ghost" id="cancelStaffAccess" type="button">Batal</button></form>`;document.getElementById('cancelStaffAccess').onclick=()=>document.getElementById('staffAccessFormMount').innerHTML='';document.getElementById('staffAccessForm').onsubmit=async event=>{event.preventDefault();try{await call('saveProgramAccess',state.token,Object.fromEntries(new FormData(event.target).entries()));toast('Penugasan Staf berhasil disimpan.');renderStaffAccess();}catch(error){toast(error.message,true);}};}
  async function renderAudit(){document.getElementById('pageTitle').textContent='Audit Log';document.getElementById('adminContent').innerHTML='<div class="skeleton">Memuat audit…</div>';try{const rows=await call('getAuditLog',state.token);document.getElementById('adminContent').innerHTML=`<div class="table-wrap"><table><thead><tr><th>Waktu</th><th>Entitas</th><th>Aksi</th><th>Pengguna</th><th>Peran</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.created_at)}</td><td>${esc(r.entity)} / ${esc(r.entity_id)}</td><td>${esc(r.action)}</td><td>${esc(r.actor_email)}</td><td>${esc(r.actor_role)}</td></tr>`).join('')}</tbody></table></div>`;}catch(error){toast(error.message,true);}}
  async function renderUsers(){document.getElementById('pageTitle').textContent='Kelola Pengguna';document.getElementById('adminContent').innerHTML='<div class="skeleton">Memuat pengguna…</div>';try{const rows=await call('listUsers',state.token);document.getElementById('adminContent').innerHTML=`<div class="toolbar"><p>${rows.length} pengguna internal</p><button id="newUser" class="button primary">Tambah pengguna</button></div><div id="userFormMount"></div><div class="table-wrap"><table><thead><tr><th>Nama</th><th>Email</th><th>Peran</th><th>Status</th><th>Diperbarui</th><th>Tindakan</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td>${esc(r.role)}</td><td><span class="tag-status">${r.active==='TRUE'?'Aktif':'Nonaktif'}</span></td><td>${esc(r.updated_at||r.created_at)}</td><td><button class="button ghost" data-user-edit="${esc(r.id)}">Edit</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Belum ada pengguna.</td></tr>'}</tbody></table></div>`;document.getElementById('newUser').onclick=()=>renderUserForm({active:'TRUE'});document.querySelectorAll('[data-user-edit]').forEach(button=>button.onclick=()=>renderUserForm(rows.find(row=>row.id===button.dataset.userEdit)));}catch(error){toast(error.message,true);}}
  function renderUserForm(record){document.getElementById('userFormMount').innerHTML=`<form id="userForm" class="form-panel"><h3>${record.id?'Ubah':'Tambah'} Pengguna</h3><div class="form-grid">${fieldHtml(['name','Nama lengkap','text'],record.name||'')}${fieldHtml(['email','Email login','email'],record.email||'')}${fieldHtml(['role','Peran','select',userRoles],record.role||'SEKRETARIS')}${fieldHtml(['active','Status akses','select','TRUE|FALSE'],record.active||'TRUE')}</div><input type="hidden" name="id" value="${esc(record.id||'')}"><button class="button primary" type="submit">Simpan</button><button class="button ghost" id="cancelUserForm" type="button">Batal</button></form>`;document.getElementById('cancelUserForm').onclick=()=>document.getElementById('userFormMount').innerHTML='';document.getElementById('userForm').onsubmit=async event=>{event.preventDefault();const input=Object.fromEntries(new FormData(event.target).entries());try{await call('saveUser',state.token,input);toast('Pengguna berhasil disimpan.');renderUsers();}catch(error){toast(error.message,true);}};}
  document.querySelectorAll('[data-public-target]').forEach(button=>button.onclick=()=>document.getElementById(button.dataset.publicTarget).scrollIntoView({behavior:'smooth'}));
  window.INITIAL_PAGE==='internal'?initInternal():initPublic();
})();
</script>
