<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halaman tidak ditemukan | Yayasan Bina Tali Kasih</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7f2; color: #17324d; }
    main { width: min(92vw, 560px); padding: 40px; text-align: center; background: #fff; border-radius: 20px; box-shadow: 0 18px 45px rgba(20, 50, 70, .12); }
    .mark { width: 64px; height: 64px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 50%; background: #123a7a; color: #fff; font-size: 28px; font-weight: 700; }
    h1 { margin: 0 0 12px; font-size: clamp(1.6rem, 4vw, 2.2rem); }
    p { margin: 0 0 26px; color: #5f6b76; line-height: 1.6; }
    nav { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a { padding: 12px 18px; border-radius: 999px; color: #fff; background: #155e57; text-decoration: none; font-weight: 700; }
    a.secondary { color: #155e57; background: #eaf2ed; }
    a:focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">Y</div>
    <h1>Halaman tidak ditemukan</h1>
    <p>Tautan yang dibuka tidak tersedia. Silakan kembali ke portal Yayasan Bina Tali Kasih.</p>
    <nav aria-label="Navigasi bantuan">
      <a href="/">Portal Publik</a>
      <a class="secondary" href="/pengurus">Portal Pengurus</a>
    </nav>
  </main>
</body>
</html>
